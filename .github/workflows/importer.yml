# 文件路径: .github/workflows/importer.yml
# 作用: 定义 GitHub Actions 自动化流水线，负责接收链接、解析内容、保存文件。

name: Import Note from WeChat

on:
  # 当接收到特定网络请求时触发
  repository_dispatch:
    types: [add-note-from-url]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 步骤1: 将您的仓库代码下载到虚拟机
      - name: Checkout repository
        uses: actions/checkout@v4

      # 步骤2: 设置 Python 3.9 环境
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # 步骤3: 安装 Python 脚本所需的库
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 python-frontmatter readability-lxml

      # 步骤4: 执行核心的解析脚本
      - name: Fetch, Format, and Save Article
        id: format
        run: python ./.github/scripts/scraper.py "${{ github.event.client_payload.url }}"

      # 步骤5: 将新生成的文件（笔记和图片）自动提交回仓库
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat(inbox): 自动化导入 - ${{ steps.format.outputs.title }}"
          # 提交所有 Markdown 文件和 attachments 文件夹下的所有文件
          file_pattern: "**/*.md attachments/**/*.*"
